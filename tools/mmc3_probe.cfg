MEMORY {
 HEADER: start=$0000, size=$0010, file=%O;
 PAD: start=$8000, size=$6000, file=%O, fill=yes;
 PRG: start=$E000, size=$2000, file=%O, fill=yes;
 CHR: start=$0000, size=$2000, file=%O, fill=yes;
}
SEGMENTS {
 HEADER: load=HEADER, type=ro;
 PAD: load=PAD, type=ro;
 CODE: load=PRG, type=ro, align=$100;
 VECTORS: load=PRG, type=ro, offset=$1FFA;
 CHR: load=CHR, type=ro;
}
