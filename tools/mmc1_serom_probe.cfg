MEMORY {
 HEADER: start=$0000, size=$0010, file=%O;
 BANK0: start=$8000, size=$4000, file=%O;
 FIXED: start=$C000, size=$4000, file=%O, fill=yes;
 CHR: start=$0000, size=$2000, file=%O;
}
SEGMENTS {
 HEADER: load=HEADER, type=ro;
 BANK0: load=BANK0, type=ro;
 CODE: load=FIXED, type=ro;
 VECTORS: load=FIXED, type=ro, start=$FFFA;
 CHR: load=CHR, type=ro;
}
